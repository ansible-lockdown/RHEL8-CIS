---

# File to skip controls if container
# Based on standard image with no changes.
# It is expected all pkgs required for the container are already installed.
# Loaded by tasks/main.yml when the target is a docker or podman container.

## controls

# Firewall -- no firewall stack in minimal containers; any value other than firewalld skips section 4.1
rhel8cis_firewall: none

# SElinux -- containers share host kernel; SELinux policy not writable
rhel8cis_selinux_disable: true

# Logging -- neither rsyslog nor journald is configured in a container
rhel8cis_syslog: none

# Authselect -- authselect cannot manage PAM inside a container image
rhel8cis_allow_authselect_updates: false

