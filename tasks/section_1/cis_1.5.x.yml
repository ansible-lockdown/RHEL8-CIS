---

- name: "1.5.1 | PATCH | Ensure core file size is configured"
  when: rhel8cis_rule_1_5_1
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - sysctl
    - rule_1.5.1
    - NIST800-53R5_CM-6
    - CCI-000366
  block:
    - name: "1.5.1 | AUDIT | Ensure core file size is configured | Find conflicting entries"
      ansible.builtin.shell: |
        set -o pipefail
        grep -Pls -- '^[ \t]*[^#\s]+\s+hard\s+core\s+(?!0[ \t]*$)\S+' /etc/security/limits.conf /etc/security/limits.d/*.conf
      args:
        executable: "{{ rhel8cis_shell_executable }}"
      changed_when: false
      check_mode: false
      failed_when: discovered_hard_core_limits.rc not in [ 0, 1, 2 ]
      register: discovered_hard_core_limits

    - name: "1.5.1 | PATCH | Ensure core file size is configured | Comment out conflicting entries"
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: '^([ \t]*[^#\s]+\s+hard\s+core\s+(?!0[ \t]*$)\S+.*)$'
        replace: '# \1'
      loop: "{{ discovered_hard_core_limits.stdout_lines }}"

    - name: "1.5.1 | PATCH | Ensure core file size is configured | Add core limits file"
      ansible.builtin.template:
        src: etc/security/limits.d/60-limits.conf.j2
        dest: /etc/security/limits.d/60-limits.conf
        owner: root
        group: root
        mode: 'u-x,go-wx'
      notify:
        - Sysctl update required
        - Reload sysctl

