---

# The CIS Control wants IPv6 disabled if not in use.
# We are using the rhel8cis_ipv6_required to specify if you have IPv6 in use
- name: "3.1.1 | PATCH | Ensure IPv6 status is identified"
  when:
    - not rhel8cis_ipv6_required
    - rhel8cis_rule_3_1_1
  tags:
    - level1-server
    - level1-workstation
    - manual
    - patch
    - ipv6
    - networking
    - rule_3.1.1
    - NIST800-53R5_CM-7
  block:
    - name: "3.1.1 | PATCH | Ensure IPv6 status is identified | Set vars for sysctl template"
      when: "'sysctl' in rhel8cis_ipv6_disable_method"
      ansible.builtin.set_fact:
        rhel8cis_sysctl_update: true
        rhel8cis_flush_ipv6_route: true

    - name: "3.1.1 | AUDIT | Ensure IPv6 status is identified | Message out implementation info"
      when: "'sysctl' in rhel8cis_ipv6_disable_method"
      ansible.builtin.debug:
        msg: "Control being set via Handler 'update sysctl' which writes to /etc/sysctl.d/60-disable_ipv6.conf"

    - name: "3.1.1 | AUDIT | Ensure IPv6 status is identified | Find IPv6 status"
      when: "'kernel' in rhel8cis_ipv6_disable_method"
      ansible.builtin.command: grubby --info=ALL
      changed_when: false
      failed_when: false
      register: discovered_rhel8cis_3_1_1_ipv6_status

    - name: "3.1.1 | PATCH | Ensure IPv6 status is identified | Disable IPV6 via Kernel"
      when:
        - "'kernel' in rhel8cis_ipv6_disable_method"
        - "'ipv6.disable=1' not in discovered_rhel8cis_3_1_1_ipv6_status.stdout"
      ansible.builtin.command: grubby --update-kernel=ALL --args="ipv6.disable=1"
      changed_when: discovered_rhel8cis_3_1_1_ipv6_status.rc == 0

- name: "3.1.2 | PATCH | Ensure wireless interfaces are disabled"
  when: rhel8cis_rule_3_1_2
  tags:
    - level1-server
    - automated
    - patch
    - wireless
    - NIST800-53R5_CM-7
    - rule_3.1.2
  block:
    - name: "3.1.2 | AUDIT | Ensure wireless interfaces are disabled | Check if nmcli command is available"
      ansible.builtin.command: rpm -q NetworkManager # noqa command-instead-of-module
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_nmcli_available

    - name: "3.1.2 | AUDIT | Ensure wireless interfaces are disabled | Check if wifi is enabled"
      when: discovered_nmcli_available.rc == 0
      ansible.builtin.command: nmcli radio wifi
      changed_when: discovered_wifi_enabled.stdout != "disabled"
      failed_when: false
      check_mode: false
      register: discovered_wifi_enabled

    - name: "3.1.2 | PATCH | Ensure wireless interfaces are disabled | Disable wifi if enabled"
      when: discovered_wifi_enabled is changed # noqa no-handler
      ansible.builtin.command: nmcli radio all off
      changed_when: true
      failed_when: false
      check_mode: false

- name: "3.1.3 | PATCH | Ensure bluetooth services are not in use"
  when: rhel8cis_rule_3_1_3
  tags:
    - level1-server
    - level2-workstation
    - automated
    - patch
    - sctp
    - NIST800-53R5_CM-7
    - rule_3.1.3
  block:
    - name: "3.1.3 | PATCH | Ensure bluetooth services are not in use | pkg"
      when:
        - not rhel8cis_bluetooth_service
        - not rhel8cis_bluetooth_mask
      ansible.builtin.package:
        name: bluez
        state: absent

    - name: "3.1.3 | PATCH | Ensure bluetooth services are not in use | mask"
      when:
        - not rhel8cis_bluetooth_service
        - rhel8cis_bluetooth_mask
      notify: Systemd_daemon_reload
      ansible.builtin.systemd:
        name: bluetooth.service
        enabled: false
        state: stopped
        masked: true
