---

- name: "3.2.1 | PATCH | Ensure atm kernel module is not available"
  when: rhel8cis_rule_3_2_1
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_3.2.1
    - atm
    - CCI-000381
    - NIST800-53R5_CM-7
  block:
    - name: "3.2.1 | PATCH | Ensure atm kernel module is not available | modprobe"
      ansible.builtin.lineinfile:
        path: /etc/modprobe.d/atm.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        mode: 'u-x,go-rwx'
        create: true
      loop:
        - { regexp: '^(#)?install atm(\s|$)', line: 'install atm /bin/true' }
        - { regexp: '^(#)?blacklist atm(\s|$)', line: 'blacklist atm' }

    - name: "3.2.1 | PATCH | Ensure atm kernel module is not available | blacklist"
      ansible.builtin.lineinfile:
        path: /etc/modprobe.d/blacklist.conf
        regexp: "^(#)?blacklist atm(\\s|$)"
        line: "blacklist atm"
        mode: 'u-x,go-rwx'
        create: true

    - name: "3.2.1 | PATCH | Ensure atm kernel module is not available | Unload module"
      when: not system_is_container
      community.general.modprobe:
        name: atm
        state: absent

