---

- name: Post Audit | Run post_remediation {{ benchmark }} audit  # noqa name[template]
  ansible.builtin.shell: |
    set -o pipefail
    umask 0022
    {{ audit_conf_dir }}/run_audit.sh -v {{ audit_vars_path }} -f {{ audit_format }} -m {{ audit_max_concurrent }} -o {{ post_audit_outfile }} -g "{{ group_names }}" {{ (audit_system_type | default('Server') | lower == 'workstation') | ternary('-w', '') }}  # noqa yaml[line-length]
  changed_when: true
  args:
    executable: "{{ rhel8cis_shell_executable }}"
  environment:
    AUDIT_BIN: "{{ audit_bin }}"
    AUDIT_CONTENT_LOCATION: "{{ audit_conf_dest | default('/opt') }}"
    AUDIT_FILE: goss.yml

- name: Post Audit | Audit not run in check mode
  when: ansible_check_mode
  ansible.builtin.set_fact:
    post_audit_results: "not run in check mode"

- name: Post Audit | Capture audit data if json format
  when:
    - audit_format == "json"
    - not ansible_check_mode
  block:
    - name: Post Audit | Capture audit data if json format
      ansible.builtin.shell: |
        set -o pipefail
        grep -E 'summary-line.*Count:.*Failed' "{{ post_audit_outfile }}" | cut -d'"' -f4
      changed_when: false
      args:
        executable: "{{ rhel8cis_shell_executable }}"
      register: post_audit_summary_json

    - name: Post Audit | Set Fact for audit summary
      ansible.builtin.set_fact:
        post_audit_results: "{{ post_audit_summary_json.stdout }}"

- name: Post Audit | Capture audit data if documentation format
  when:
    - audit_format == "documentation"
    - not ansible_check_mode
  block:
    - name: Post Audit | Capture audit data if documentation format
      ansible.builtin.shell: |
        set -o pipefail
        tail -2 "{{ post_audit_outfile }}"  | tac | tr '\n' ' '
      changed_when: false
      args:
        executable: "{{ rhel8cis_shell_executable }}"
      register: post_audit_summary_documentation

    - name: Post Audit | Set Fact for audit summary
      ansible.builtin.set_fact:
        post_audit_results: "{{ post_audit_summary_documentation.stdout }}"
