---

- name: "SECTION | 5.1 | Configure SSH Server"
  when: "'openssh-server' in ansible_facts['packages']"
  ansible.builtin.import_tasks:
    file: cis_5.1.x.yml

- name: "SECTION | 5.2 | Configure privilege escalation"
  ansible.builtin.import_tasks:
    file: cis_5.2.x.yml

- name: "SECTION | 5.3.1 | Configure PAM software packages"
  ansible.builtin.import_tasks:
    file: cis_5.3.1.x.yml

- name: "SECTION | 5.3.2 | Authselect"
  when:
    - rhel8cis_allow_authselect_updates
    - rhel8cis_disruption_high
  ansible.builtin.import_tasks:
    file: cis_5.3.2.x.yml

- name: "SECTION | 5.3.3 | Check the custom authselect profile exists"
  when:
    - rhel8cis_disruption_high
    - rhel8cis_allow_authselect_updates
  ansible.builtin.stat:
    path: "/etc/authselect/custom/{{ rhel8cis_authselect_custom_profile_name }}"
  register: discovered_authselect_custom_profile_dir

- name: "SECTION | 5.3.3 | Warn when the custom authselect profile is missing"
  when:
    - rhel8cis_disruption_high
    - rhel8cis_allow_authselect_updates
    - not discovered_authselect_custom_profile_dir.stat.exists | default(false)
  ansible.builtin.debug:
    msg: "Warning!! /etc/authselect/custom/{{ rhel8cis_authselect_custom_profile_name }} does not exist (rule 5.3.2.1 creates it), authselect profile PAM edits in 5.3.3.x are skipped"

- name: "SECTION | 5.3.3.1.x | Configure module pam_faillock"
  when: rhel8cis_disruption_high
  ansible.builtin.import_tasks:
    file: cis_5.3.3.1.x.yml

- name: "SECTION | 5.3.3.2.x | Configure module pam_pwquality"
  when: rhel8cis_disruption_high
  ansible.builtin.import_tasks:
    file: cis_5.3.3.2.x.yml

- name: "SECTION | 5.3.3.3.x | Configure module pam_pwhistory"
  when: rhel8cis_disruption_high
  ansible.builtin.import_tasks:
    file: cis_5.3.3.3.x.yml

- name: "SECTION | 5.3.3.4.x | Configure module pam_unix"
  when: rhel8cis_disruption_high
  ansible.builtin.import_tasks:
    file: cis_5.3.3.4.x.yml

- name: "SECTION | 5.3.x | Apply the authselect profile before later sections run"
  ansible.builtin.meta: flush_handlers

- name: "SECTION | 5.4.1.x | Shadow suite"
  ansible.builtin.import_tasks:
    file: cis_5.4.1.x.yml

- name: "SECTION | 5.4.2.x | Root and sys accounts"
  ansible.builtin.import_tasks:
    file: cis_5.4.2.x.yml

- name: "SECTION | 5.4.3.x | User environment"
  ansible.builtin.import_tasks:
    file: cis_5.4.3.x.yml
