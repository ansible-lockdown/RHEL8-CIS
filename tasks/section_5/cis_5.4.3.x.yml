---

- name: "5.4.3.1 | PATCH | Ensure nologin is not listed in /etc/shells"
  when: rhel8cis_rule_5_4_3_1
  tags:
    - level2-server
    - level2-workstation
    - automated
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-2
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
    - NIST800-53R5_IA-5
    - patch
    - shells
    - rule_5.4.3.1
  ansible.builtin.replace:
    path: /etc/shells
    regexp: ^([ \t]*[^#\s].*nologin.*)$
    replace: '# \1'

- name: "5.4.3.2 | PATCH | Ensure default user shell timeout is configured"
  when: rhel8cis_rule_5_4_3_2
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
    - shell
    - rule_5.4.3.2
  ansible.builtin.blockinfile:
    path: "{{ item.path }}"
    state: "{{ item.state }}"
    marker: "# {mark} - CIS benchmark - Ansible-lockdown"
    create: true
    mode: 'go-wx'
    block: |
      TMOUT={{ rhel8cis_shell_session_timeout }}
      readonly TMOUT
      export TMOUT
  loop:
    - { path: "{{ rhel8cis_shell_session_file }}", state: present }
    - { path: /etc/profile, state: "{{ (rhel8cis_shell_session_file == '/etc/profile') | ternary('present', 'absent') }}" }

- name: "5.4.3.3 | PATCH | Ensure default user umask is configured"
  when: rhel8cis_rule_5_4_3_3
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - umask
    - NIST800-53R5_CM-6
    - CCI-000366
    - rule_5.4.3.3
  block:
    - name: "5.4.3.3 | PATCH | Ensure default user umask is configured | Set UMASK in /etc/login.defs"
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^\s*UMASK\s+'
        line: "UMASK {{ rhel8cis_bash_umask }}"

    - name: "5.4.3.3 | AUDIT | Ensure default user umask is configured | Find shell initialization files setting umask"
      ansible.builtin.shell: |
        set -o pipefail
        grep -lPsi -- '^\h*umask\h+\S' /etc/profile /etc/bashrc /etc/bash.bashrc /etc/profile.d/sh.local /etc/profile.d/*.sh
      args:
        executable: "{{ rhel8cis_shell_executable }}"
      changed_when: false
      check_mode: false
      failed_when: discovered_umask_files.rc not in [ 0, 1, 2 ]
      register: discovered_umask_files

    - name: "5.4.3.3 | PATCH | Ensure default user umask is configured | Tighten weak umask statements"
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: '(?i)^(\s*umask\s+)(?!(?:0?[0-7][2367]7|u=[rwx]{0,3},g=[rx]{0,2},o=)(?:[\s#;]|$))[^\s#;]+'
        replace: '\g<1>{{ rhel8cis_bash_umask }}'
      loop: "{{ discovered_umask_files.stdout_lines }}"

    - name: "5.4.3.3 | PATCH | Ensure default user umask is configured | add profile script"
      ansible.builtin.template:
        src: etc/profile.d/60_default_umask.sh.j2
        dest: /etc/profile.d/60_default_umask.sh
        owner: root
        group: root
        mode: 'go-w'
