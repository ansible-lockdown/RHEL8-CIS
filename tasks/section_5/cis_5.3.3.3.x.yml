---

- name: "5.3.3.3.1 | PATCH | Ensure password history remember is configured"
  when: rhel8cis_rule_5_3_3_3_1
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - NIST800-53R5_IA-5
    - pam
    - rule_5.3.3.3.1
  block:
    - name: "5.3.3.3.1 | PATCH | Ensure password history remember is configured | pwhistory.conf"
      ansible.builtin.lineinfile:
        path: /etc/security/pwhistory.conf
        regexp: '^(#|)\s*remember\s*=\s*\d'
        line: "remember = {{ rhel8cis_pam_pwhistory_remember }}"

    - name: "5.3.3.3.1 | PATCH | Ensure password history remember is configured | authselect_files"
      when:
        - rhel8cis_allow_authselect_updates
        - discovered_authselect_custom_profile_dir.stat.exists | default(false)
      ansible.builtin.replace:
        path: "/etc/authselect/custom/{{ rhel8cis_authselect_custom_profile_name }}/{{ item }}-auth"
        regexp: ^(\s*password\s+(?:requisite|required|sufficient)\s+pam_pwhistory\.so\b.*?)\s+remember\s*=\s*\S+(.*)$
        replace: \1\2
      loop:
        - password
        - system
      notify: Update authselect

- name: "5.3.3.3.2 | PATCH | Ensure password history is enforced for the root user"
  when: rhel8cis_rule_5_3_3_3_2
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - NIST800-53R5_IA-5
    - pam
    - rule_5.3.3.3.2
  block:
    - name: "5.3.3.3.2 | PATCH | Ensure password history is enforced for the root user | pwhistory.conf"
      ansible.builtin.lineinfile:
        path: /etc/security/pwhistory.conf
        regexp: '^(#|)\s*enforce_for_root'
        line: "enforce_for_root"

    - name: "5.3.3.3.2 | PATCH | Ensure password history is enforced for the root user | pam_files"
      when: not rhel8cis_allow_authselect_updates
      ansible.builtin.replace:
        path: "/etc/pam.d/{{ item }}-auth"
        regexp: ^(\s*password\s+(?:requisite|required|sufficient)\s+pam_pwhistory\.so\b.*?)\s+enforce_for_root(.*)$
        replace: \1\2
      loop:
        - password
        - system

    - name: "5.3.3.3.2 | PATCH | Ensure password history is enforced for the root user | authselect_files"
      when:
        - rhel8cis_allow_authselect_updates
        - discovered_authselect_custom_profile_dir.stat.exists | default(false)
      ansible.builtin.replace:
        path: "/etc/authselect/custom/{{ rhel8cis_authselect_custom_profile_name }}/{{ item }}-auth"
        regexp: ^(\s*password\s+(?:requisite|required|sufficient)\s+pam_pwhistory\.so\b.*?)\s+enforce_for_root(.*)$
        replace: \1\2
      loop:
        - password
        - system
      notify: Update authselect

- name: "5.3.3.3.3 | PATCH | Ensure pam_pwhistory includes use_authtok"
  when: rhel8cis_rule_5_3_3_3_3
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - NIST800-53R5_IA-5
    - pam
    - rule_5.3.3.3.3
  block:
    - name: "5.3.3.3.3 | PATCH | Ensure pam_pwhistory includes use_authtok | pam_files"
      when: not rhel8cis_allow_authselect_updates
      ansible.builtin.replace:
        path: "/etc/pam.d/{{ item }}-auth"
        regexp: ^(\s*password\s+(?:requisite|required|sufficient)\s+pam_pwhistory\.so\b)(?!.*\buse_authtok\b)(.*)$
        replace: \1 use_authtok\2
      loop:
        - password
        - system

    - name: "5.3.3.3.3 | PATCH | Ensure pam_pwhistory includes use_authtok | authselect_files"
      when:
        - rhel8cis_allow_authselect_updates
        - discovered_authselect_custom_profile_dir.stat.exists | default(false)
      ansible.builtin.replace:
        path: "/etc/authselect/custom/{{ rhel8cis_authselect_custom_profile_name }}/{{ item }}-auth"
        regexp: ^(\s*password\s+(?:requisite|required|sufficient)\s+pam_pwhistory\.so\b)(?!.*\buse_authtok\b)(.*)$
        replace: \1 use_authtok\2
      loop:
        - password
        - system
      notify: Update authselect
