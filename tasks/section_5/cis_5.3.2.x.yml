---

- name: "5.3.2.1 | PATCH | Ensure active authselect profile includes pam modules"
  when:
    - rhel8cis_rule_5_3_2_1
    - rhel8cis_disruption_high
    - rhel8cis_allow_authselect_updates
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - authselect
    - rule_5.3.2.1
  block:
    - name: "5.3.2.1 | PATCH | Ensure active authselect profile includes pam modules | Create custom profiles"
      when: rhel8cis_authselect_custom_profile_name not in prelim_authselect_current_profile.stdout or prelim_authselect_current_profile.stdout is not defined
      ansible.builtin.command: "/usr/bin/authselect create-profile {{ rhel8cis_authselect_custom_profile_name }} -b {{ rhel8cis_authselect_default_profile_to_copy }}"
      changed_when: true
      args:
        creates: "/etc/authselect/custom/{{ rhel8cis_authselect_custom_profile_name }}"

    - name: "5.3.2.1 | AUDIT | Ensure active authselect profile includes pam modules | get profile features"
      ansible.builtin.command: "/usr/bin/authselect list-features custom/{{ rhel8cis_authselect_custom_profile_name }}"
      changed_when: false
      check_mode: false
      register: discovered_authselect_profile_features

    - name: "5.3.2.1 | PATCH | Ensure active authselect profile includes pam modules | Add missing pam modules to config | pwquality"
      when: "'with-pwquality' not in discovered_authselect_profile_features.stdout_lines"
      ansible.builtin.lineinfile:
        path: "/etc/authselect/custom/{{ rhel8cis_authselect_custom_profile_name }}/{{ item }}-auth"
        regexp: ^password\s*requisite\s*pam_pwquality.so.*
        line: password    requisite                                    pam_pwquality.so local_users_only        {include if "with-pwquality"}
      loop:
        - system
        - password
      notify: Update authselect

    - name: "5.3.2.1 | AUDIT | Ensure active authselect profile includes pam modules | Get current profile and features"
      ansible.builtin.command: authselect current
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_authselect_current_profile

    - name: "5.3.2.1 | PATCH | Ensure active authselect profile includes pam modules | Backup and Add pam modules"
      when: >-
        ('custom/' ~ rhel8cis_authselect_custom_profile_name) not in discovered_authselect_current_profile.stdout or
        (discovered_authselect_wanted_features | difference(discovered_authselect_current_profile.stdout_lines | map('regex_replace', '^-\\s*', '') | list) | length > 0)
      ansible.builtin.command: "/usr/bin/authselect select custom/{{ rhel8cis_authselect_custom_profile_name }} {{ discovered_authselect_keep_features | union(discovered_authselect_wanted_features) | join(' ') }} --force --backup=rhel8cis-preremediate-{{ lookup('pipe', 'date +%Y-%m-%d-%H%M') }}"
      vars:
        discovered_authselect_wanted_features: "{{ (['with-faillock'] if rhel8cis_rule_5_3_2_2 else []) + (['with-pwquality'] if rhel8cis_rule_5_3_2_3 else []) + (['with-pwhistory'] if rhel8cis_rule_5_3_2_4 else []) + (['without-nullok'] if rhel8cis_rule_5_3_3_4_1 else []) }}"
        discovered_authselect_keep_features: "{{ discovered_authselect_current_profile.stdout_lines | select('match', '^-\\s') | map('regex_replace', '^-\\s*', '') | list | intersect(discovered_authselect_profile_features.stdout_lines) }}"
      changed_when: true

- name: "5.3.2.2 | PATCH | Ensure pam_faillock module is enabled"
  when:
    - rhel8cis_rule_5_3_2_2
    - rhel8cis_disruption_high
    - rhel8cis_allow_authselect_updates
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - NIST800-53R5_AC-7
    - authselect
    - rule_5.3.2.2
  notify: Update authselect
  block:
    - name: "5.3.2.2 | AUDIT | Ensure pam_faillock module is enabled | Get current config"
      ansible.builtin.shell: |
        set -o pipefail
        authselect current | grep faillock
      args:
        executable: "{{ rhel8cis_shell_executable }}"
      changed_when: false
      failed_when: discovered_authselect_current_faillock.rc not in [ 0, 1 ]
      check_mode: false
      register: discovered_authselect_current_faillock

    - name: "5.3.2.2 | PATCH | Ensure pam_faillock module is enabled | Add feature if missing"
      when: discovered_authselect_current_faillock.rc != 0
      ansible.builtin.command: authselect enable-feature with-faillock
      changed_when: true

- name: "5.3.2.3 | PATCH | Ensure pam_pwquality module is enabled"
  when:
    - rhel8cis_rule_5_3_2_3
    - rhel8cis_disruption_high
    - rhel8cis_allow_authselect_updates
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - NIST800-53R5_CM-6
    - authselect
    - rule_5.3.2.3
  block:
    - name: "5.3.2.3 | AUDIT | Ensure pam_pwquality module is enabled | Get current config"
      ansible.builtin.shell: |
        set -o pipefail
        authselect current | grep quality
      args:
        executable: "{{ rhel8cis_shell_executable }}"
      changed_when: false
      failed_when: discovered_authselect_current_quality.rc not in [ 0, 1 ]
      check_mode: false
      register: discovered_authselect_current_quality

    - name: "5.3.2.3 | PATCH | Ensure pam_pwquality module is enabled | Add feature if missing"
      when: discovered_authselect_current_quality.rc != 0
      ansible.builtin.command: authselect enable-feature with-pwquality
      changed_when: true
      notify: Update authselect

- name: "5.3.2.4 | PATCH | Ensure pam_pwhistory module is enabled"
  when:
    - rhel8cis_rule_5_3_2_4
    - rhel8cis_disruption_high
    - rhel8cis_allow_authselect_updates
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - NIST800-53R5_IA-5
    - authselect
    - rule_5.3.2.4
  block:
    - name: "5.3.2.4 | AUDIT | Ensure pam_pwhistory module is enabled | Get current config"
      ansible.builtin.shell: |
        set -o pipefail
        authselect current | grep pwhistory
      args:
        executable: "{{ rhel8cis_shell_executable }}"
      changed_when: false
      failed_when: discovered_authselect_current_history.rc not in [ 0, 1 ]
      check_mode: false
      register: discovered_authselect_current_history

    - name: "5.3.2.4 | PATCH | Ensure pam_pwhistory module is enabled | enable feature"
      when: discovered_authselect_current_history.rc != 0
      ansible.builtin.command: authselect enable-feature with-pwhistory
      changed_when: true
      notify: Update authselect

- name: "5.3.2.5 | AUDIT | Ensure pam_unix module is enabled"
  when: rhel8cis_rule_5_3_2_5
  tags:
    - level1-server
    - level1-workstation
    - automated
    - audit
    - NIST800-53R5_IA-5
    - authselect
    - rule_5.3.2.5
  block:
    - name: "5.3.2.5 | AUDIT | Ensure pam_unix module is enabled | Find missing pam_unix stack entries"
      ansible.builtin.shell: |
        set -o pipefail
        for l_file in /etc/pam.d/system-auth /etc/pam.d/password-auth; do
          for l_type in auth account password session; do
            grep -Pq -- "^\h*${l_type}\h+\H+\h+pam_unix\.so\b" "$l_file" || echo "$l_file:$l_type"
          done
        done
      args:
        executable: "{{ rhel8cis_shell_executable }}"
      changed_when: false
      check_mode: false
      register: discovered_pam_unix_missing

    - name: "5.3.2.5 | AUDIT | Ensure pam_unix module is enabled | Warn if pam_unix entries are missing"
      when: discovered_pam_unix_missing.stdout | length > 0
      ansible.builtin.debug:
        msg:
          - "Warning!! pam_unix.so is missing from these PAM stacks"
          - "{{ discovered_pam_unix_missing.stdout_lines }}"
          - "Restore the entries in the active authselect profile templates and run authselect apply-changes"

    - name: "5.3.2.5 | AUDIT | Ensure pam_unix module is enabled | Warn count"
      when: discovered_pam_unix_missing.stdout | length > 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '5.3.2.5'
