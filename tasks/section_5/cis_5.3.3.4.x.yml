---

- name: "5.3.3.4.1 | PATCH | Ensure pam_unix does not include nullok"
  when: rhel8cis_rule_5_3_3_4_1
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - NIST800-53R5_CM-6
    - pam
    - rule_5.3.3.4.1
  block:
    - name: "5.3.3.4.1 | AUDIT | Ensure pam_unix does not include nullok | capture state"
      ansible.builtin.shell: |
        set -o pipefail
        grep -P -- '^\h*(auth|account|password|session)\h+(requisite|required|sufficient)\h+pam_unix\.so\b' /etc/pam.d/{password,system}-auth | grep -P -- '\bnullok\b'
      args:
        executable: "{{ rhel8cis_shell_executable }}"
      changed_when: false
      failed_when: discovered_pam_nullok.rc not in [ 0, 1 ]
      check_mode: false
      register: discovered_pam_nullok

    - name: "5.3.3.4.1 | PATCH | Ensure pam_unix does not include nullok | pam_files"
      when:
        - discovered_pam_nullok.stdout | length > 0
        - not rhel8cis_allow_authselect_updates
      ansible.builtin.replace:
        path: "/etc/pam.d/{{ item }}-auth"
        regexp: ^(\s*(?:auth|account|password|session)\s+\S+\s+pam_unix\.so\b.*?)\s+nullok\b(.*)$
        replace: \1\2
      loop:
        - password
        - system

    - name: "5.3.3.4.1 | PATCH | Ensure pam_unix does not include nullok | update authselect"
      when:
        - discovered_pam_nullok.stdout | length > 0
        - rhel8cis_allow_authselect_updates
      ansible.builtin.command: authselect enable-feature without-nullok
      changed_when: true
      notify: Update authselect

- name: "5.3.3.4.2 | PATCH | Ensure pam_unix does not include remember"
  when: rhel8cis_rule_5_3_3_4_2
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - NIST800-53R5_NA
    - pam
    - rule_5.3.3.4.2
  block:
    - name: "5.3.3.4.2 | PATCH | Ensure pam_unix does not include remember | pam_files"
      when: not rhel8cis_allow_authselect_updates
      ansible.builtin.replace:
        path: "/etc/pam.d/{{ item }}-auth"
        regexp: ^(\s*password\s+\S+\s+pam_unix\.so\b.*?)\s+remember\s*=\s*\S+(.*)$
        replace: \1\2
      loop:
        - password
        - system

    - name: "5.3.3.4.2 | PATCH | Ensure pam_unix does not include remember | authselect_files"
      when:
        - rhel8cis_allow_authselect_updates
        - discovered_authselect_custom_profile_dir.stat.exists | default(false)
      ansible.builtin.replace:
        path: "/etc/authselect/custom/{{ rhel8cis_authselect_custom_profile_name }}/{{ item }}-auth"
        regexp: ^(\s*password\s+\S+\s+pam_unix\.so\b.*?)\s+remember\s*=\s*\S+(.*)$
        replace: \1\2
      loop:
        - password
        - system
      notify: Update authselect

- name: "5.3.3.4.3 | PATCH | Ensure pam_unix includes a strong password hashing algorithm"
  when: rhel8cis_rule_5_3_3_4_3
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - NIST800-53R5_IA-5
    - pam
    - rule_5.3.3.4.3
  vars:
    discovered_pam_unix_hash_edits:
      - regexp: ^(\s*password\s+(?:requisite|required|sufficient)\s+pam_unix\.so\b.*?\s)(?:md5|bigcrypt|sha256|blowfish|gost_yescrypt|sha512|yescrypt)\b
        replace: \1{{ rhel8cis_pam_pwhash }}
      - regexp: ^(\s*password\s+(?:requisite|required|sufficient)\s+pam_unix\.so\b)(?!.*\b(?:md5|bigcrypt|sha256|blowfish|gost_yescrypt|sha512|yescrypt)\b)(.*)$
        replace: \1 {{ rhel8cis_pam_pwhash }}\2
  block:
    - name: "5.3.3.4.3 | PATCH | Ensure pam_unix includes a strong password hashing algorithm | pam_files"
      when: not rhel8cis_allow_authselect_updates
      ansible.builtin.replace:
        path: "/etc/pam.d/{{ item.0 }}-auth"
        regexp: "{{ item.1.regexp }}"
        replace: "{{ item.1.replace }}"
      loop: "{{ ['password', 'system'] | product(discovered_pam_unix_hash_edits) | list }}"

    - name: "5.3.3.4.3 | PATCH | Ensure pam_unix includes a strong password hashing algorithm | authselect_files"
      when:
        - rhel8cis_allow_authselect_updates
        - discovered_authselect_custom_profile_dir.stat.exists | default(false)
      ansible.builtin.replace:
        path: "/etc/authselect/custom/{{ rhel8cis_authselect_custom_profile_name }}/{{ item.0 }}-auth"
        regexp: "{{ item.1.regexp }}"
        replace: "{{ item.1.replace }}"
      loop: "{{ ['password', 'system'] | product(discovered_pam_unix_hash_edits) | list }}"
      notify: Update authselect

- name: "5.3.3.4.4 | PATCH | Ensure pam_unix includes use_authtok"
  when: rhel8cis_rule_5_3_3_4_4
  tags:
    - level1-server
    - level1-workstation
    - automated
    - patch
    - NIST800-53R5_IA-5
    - pam
    - rule_5.3.3.4.4
  block:
    - name: "5.3.3.4.4 | PATCH | Ensure pam_unix includes use_authtok | pam_files"
      when: not rhel8cis_allow_authselect_updates
      ansible.builtin.replace:
        path: "/etc/pam.d/{{ item }}-auth"
        regexp: ^(\s*password\s+(?:requisite|required|sufficient)\s+pam_unix\.so\b)(?!.*\buse_authtok\b)(.*)$
        replace: \1\2 use_authtok
      loop:
        - password
        - system

    - name: "5.3.3.4.4 | PATCH | Ensure pam_unix includes use_authtok | authselect_files"
      when:
        - rhel8cis_allow_authselect_updates
        - discovered_authselect_custom_profile_dir.stat.exists | default(false)
      ansible.builtin.replace:
        path: "/etc/authselect/custom/{{ rhel8cis_authselect_custom_profile_name }}/{{ item }}-auth"
        regexp: ^(\s*password\s+(?:requisite|required|sufficient)\s+pam_unix\.so\b)(?!.*\buse_authtok\b)(.*)$
        replace: \1\2 use_authtok
      loop:
        - password
        - system
      notify: Update authselect
