- name: Selinux relabel
  when:
    - rhel8cis_enable_selinux_relabel
    - ansible_facts.selinux.status == 'disabled'
  ansible.builtin.file:
    path: /.autorelabel
  notify: Set reboot required

- name: Sysctl update required
  ansible.builtin.set_fact:
    rhel8cis_sysctl_update: true

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Coredump Reload
  ansible.builtin.systemd:
    name: systemd-coredump.socket
    state: restarted

- name: Reload firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: reloaded

- name: Restart postfix
  ansible.builtin.systemd:
    name: postfix
    state: restarted

- name: Update Crypto Policy
  ansible.builtin.set_fact:
    rhel8cis_full_crypto_policy: "{{ rhel8cis_crypto_policy }}{{ rhel8cis_crypto_policy_module }}{% if rhel8cis_additional_crypto_policy_module | length > 0 %}:{{ rhel8cis_additional_crypto_policy_module }}{% endif %}"
  notify: Set Crypto Policy

- name: Set Crypto Policy
  when: prelim_system_wide_crypto_policy.stdout != rhel8cis_full_crypto_policy
  ansible.builtin.command: update-crypto-policies --set "{{ rhel8cis_full_crypto_policy }}"
  changed_when: true
  notify:
    - Set reboot required
    - Restart sshd

- name: Restart chronyd
  ansible.builtin.service:
    name: chronyd
    state: restarted

- name: Restart sshd
  ansible.builtin.systemd:
    name: sshd
    state: restarted

- name: Reload dconf
  ansible.builtin.command: dconf update
  changed_when: true

- name: Update auditd rules
  ansible.builtin.template:
    src: audit/99_auditd.rules.j2
    dest: /etc/audit/rules.d/99_auditd.rules
    owner: root
    group: root
    mode: 'go-rwx'
  notify: Restart auditd

- name: Restart journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted

- name: Restart systemd journal upload
  ansible.builtin.systemd:
    name: systemd-journal-upload
    state: restarted

- name: Rebuild grub
  ansible.builtin.command: "grub2-mkconfig -o {{ prelim_grub_cfg.stat.lnk_source }}"
  changed_when: true
  ignore_errors: true  # noqa ignore-errors
  notify: Set reboot required

- name: Restart rsyslog
  ansible.builtin.service:
    name: rsyslog
    state: restarted

- name: Systemd daemon reload
  ansible.builtin.systemd:
    daemon-reload: true

## Auditd tasks note order for handlers to run

- name: Auditd immutable check
  ansible.builtin.command: grep -c "^-e 2" /etc/audit/rules.d/99_auditd.rules
  changed_when: false
  register: discovered_auditd_immutable_check

- name: Audit immutable fact
  when: discovered_auditd_immutable_check.stdout == '1'
  ansible.builtin.debug:
    msg: "Reboot required for auditd to apply new rules as immutable set"
  notify: Set reboot required

- name: Restart auditd
  ansible.builtin.command: /sbin/service auditd restart  # noqa command-instead-of-module
  changed_when: true

- name: Set reboot required
  ansible.builtin.set_fact:
    reboot_required: true
