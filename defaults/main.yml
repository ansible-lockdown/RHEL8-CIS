---

# defaults file for RHEL8-CIS

system_is_container: false
# Place to find the container yml file for your environment - /vars/... This can be adjusted for your requirements.
container_vars_file: is_container.yml

os_check: true
# rhel8cis is left off the front of this var for consistency in testing pipeline
# system_is_ec2 toggle will disable tasks that fail on Amazon EC2 instances. Set true to skip and false to run tasks
system_is_ec2: false

rhel8cis_section1: true
rhel8cis_section2: true
rhel8cis_section3: true
rhel8cis_section4: true
rhel8cis_section5: true
rhel8cis_section6: true
rhel8cis_section7: true

rhel8cis_level_1: true
rhel8cis_level_2: true
rhel8cis_selinux_disable: false

# Some tests can have a heavy impact on system e.g. find on all filesystems etc
rhel8cis_disruption_high: false

# Create managed not custom local_facts files
create_benchmark_facts: true
ansible_facts_path: /etc/ansible/facts.d

## Benchmark name used by auditing control role
# The audit variable found at the base
benchmark: RHEL8-CIS
benchmark_version: v4.0.0

# Whether to skip the reboot
skip_reboot: true

# Modify behavior of changed_when if reboot is pending and skipped to allow idempotency to succeed
reboot_warning_changed_when: true

# A location that can be used as a temporary location to execute scripts
# note the drive with need exec permissions used by 1.1.1.11
rhel8cis_temp_exec_location: /var

## Root user used
# Root by default is not used unless setup by user
# The role will only run certain commands if set to true
# This allows the ability to skip tasks that may cause an issue
rhel8cis_uses_root: false

###########################################
### Goss is required on the remote host ###
### vars/auditd.yml for other settings  ###

# If the any of the following are set the variables used by them are loaded in vars/audit.yml these can be overridden by your
# preferred method of variable management (e.g., vault, group_vars, host_vars, inventory etc.)

# Allow audit to setup the requirements including installing git (if option chosen and downloading and adding goss binary to system)
setup_audit: false

# enable audits to run - this runs the audit and get the latest content
run_audit: false

## Only run Audit do not remediate
audit_only: false

# Run heavy tests - some tests can have more impact on a system enabling these can have greater impact on a system
audit_run_heavy_tests: true

# Fetch audit output files back to the controller
fetch_audit_output: false

# Method of getting,uploading the summary files
## Ensure access and permissions are available for these to occur.
## options are
# fetch - fetches from server and moves to location on the ansible controller (could be a mount point available to controller)
# copy - copies file to a location available to the managed node
audit_output_collection_method: fetch

# Where the audit logs are stored
audit_log_dir: '/opt'

# Location to put the audit files
audit_output_destination: "{{ audit_log_dir }}/audit_summaries/"

#############################

### Goss Settings ##
####### END ########

